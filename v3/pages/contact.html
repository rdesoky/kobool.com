<div class="pg_body">
    <div class="pg_intro" data-string="str:contact.intro"></div>
    <form id="ContactForm" class="form_frame" name="contact_us">
        <div class="field_label" data-string="str:contact.name_prompt"></div>
        <div class="form_input">
            <input type="text" name="name">
        </div>
        <div class="field_label" data-string="str:contact.email_prompt"></div>
        <div class="form_field">
            <input type="text" name="email">
        </div>
        <div class="field_label" data-string="str:contact.title_prompt"></div>
        <div class="form_field">
            <input type="text" name="msg_title">
        </div>
        <div class="field_label" data-string="str:contact.msg_prompt"></div>
        <div class="form_field">
            <textarea name="msg" rows="4"></textarea>
        </div>
        <div class="buttons_bar"><input type="submit" value="" data-string="str:contact.submit" data-string-attr="value"></div>
    </form>
</div>
