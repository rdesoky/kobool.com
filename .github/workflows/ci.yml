name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Test
        run: npm test

      - name: Build (staging)
        run: npm run build:staging

      - name: Validate
        run: npm run check -- --env=staging

      - name: Upload dist
        uses: actions/upload-artifact@v7
        with:
          name: dist-staging
          path: dist
          retention-days: 7
