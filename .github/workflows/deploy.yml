name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, prod]
        default: staging

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Test
        run: npm test

      - name: Resolve environment
        id: env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.environment }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=staging" >> "$GITHUB_OUTPUT"
          fi

      # The site is served from a domain root (staging.kobool.com), so URLs
      # stay root-absolute and no --base rewrite is needed. The CNAME file
      # claims the custom domain; HTTPS enforcement is off because every
      # kobool.com host is http-only.
      - name: Build
        run: |
          if [ "${{ steps.env.outputs.name }}" = "prod" ]; then
            npm run build:prod
          else
            npm run build:staging
          fi

      - name: Validate
        run: |
          if [ "${{ steps.env.outputs.name }}" = "prod" ]; then
            npm run check -- --env=prod
          else
            npm run check -- --env=staging
          fi

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'staging' }}
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
